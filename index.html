<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SWAGPAGE</title>
<link rel="icon" href="SWAG.jpg">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--ink:#cfe0ff;--dim:#7f95d6;--glow:#39b0ff;--panel:rgba(5,15,75,.72);--line:#3a4f95}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#0a1a6a;color:var(--ink);font-family:'VT323',ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:1px;overflow-x:hidden;user-select:none;text-shadow:2px 2px 0 rgba(0,10,60,.85)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
.app{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:96px minmax(260px,1fr) 1fr;gap:18px}
.icons{display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center}
.ic{background:none;border:0;font-size:36px;opacity:.5;filter:grayscale(.7);cursor:pointer;padding:6px;transition:.3s;color:var(--ink);font-family:inherit;text-align:center;line-height:1}
.ic small{display:block;font-size:14px;opacity:0;transition:.3s;margin-top:2px}
.ic:hover{opacity:.85;box-shadow:none}
.ic.on{opacity:1;filter:drop-shadow(0 0 12px var(--glow));transform:scale(1.5);margin:14px 0}
.ic.on small{opacity:1;font-size:12px}
#stage{position:relative;height:min(64vh,620px);min-height:440px;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(transparent,#000 10%,#000 90%,transparent);touch-action:none}
.cv{position:absolute;left:50%;top:50%;border:3px solid var(--line);background-size:cover;background-position:center;image-rendering:auto;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;padding:6px;line-height:1;transition:transform .45s cubic-bezier(.2,.8,.2,1),width .45s,height .45s,opacity .45s,border-color .3s,box-shadow .3s}
.cv.cur{border-color:var(--glow);box-shadow:0 0 26px var(--glow),inset 0 0 14px rgba(57,176,255,.55)}
.cv.pl{box-shadow:0 0 calc(20px + var(--b,0)*30px) #8fd4ff,inset 0 0 calc(10px + var(--b,0)*15px) rgba(120,200,255,.8);transition:transform .45s cubic-bezier(.2,.8,.2,1),width .45s,height .45s,opacity .45s}
.cv.in{animation:fin .5s both}
.cv em{font-style:normal;font-size:3em;margin:auto}
.cv span{background:rgba(0,0,25,.7);padding:3px 4px;text-transform:uppercase;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes pulse{50%{box-shadow:0 0 44px #8fd4ff,inset 0 0 20px rgba(120,200,255,.8)}}
@keyframes fin{from{opacity:0;margin-top:40px}}
.info{align-self:center;min-width:0}
#catn{color:var(--dim);font-size:22px}
.info h1{font-size:46px;margin:2px 0 4px;color:#fff;text-shadow:3px 3px 0 #041050,0 0 12px var(--glow);font-weight:400;word-break:break-word;line-height:1}
#meta{font-size:28px;color:#82c8ff;margin:0}
.edit{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.edit[hidden],#act[hidden]{display:none}
.edit input{font:inherit;background:var(--panel);border:2px solid var(--line);color:#fff;padding:3px 8px;min-width:0;user-select:text}
.edit input:focus{outline:none;border-color:var(--glow)}
.w{grid-column:1/3}
button,.btn{font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);padding:4px 12px;cursor:pointer;letter-spacing:1px;transition:.2s;display:inline-block;text-align:center}
button:hover,.btn:hover{border-color:var(--glow);color:#fff;box-shadow:0 0 12px var(--glow)}
button.on{border-color:var(--glow);color:#fff}
#act{margin-top:16px;font-size:28px}
.bar{grid-column:1/-1}
.player{display:flex;align-items:center;gap:14px;padding:10px 18px;border-radius:40px;background:linear-gradient(180deg,rgba(70,130,255,.35),rgba(5,15,75,.9) 55%,rgba(5,15,75,.95));border:1px solid rgba(140,190,255,.5);box-shadow:0 0 0 1px rgba(0,10,50,.6),0 10px 30px rgba(0,10,60,.5),inset 0 1px 0 rgba(255,255,255,.25),inset 0 -14px 22px rgba(0,10,60,.5);position:relative;overflow:hidden}
.player::before{content:"";position:absolute;left:6%;right:6%;top:2px;height:40%;border-radius:40px 40px 60% 60%/40px 40px 30px 30px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));pointer-events:none}
.logo{font-size:26px;opacity:.9;filter:drop-shadow(0 0 6px var(--glow));flex:none}
.pl-ctrl{display:flex;align-items:center;gap:4px;flex:none}
.pb{font-size:20px;width:38px;height:38px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;background:rgba(10,25,100,.55);border:1px solid rgba(140,190,255,.4)}
.pb:hover{box-shadow:0 0 10px var(--glow)}
.pl-prog{flex:1;display:flex;align-items:center;gap:12px;min-width:60px}
.track{flex:1;height:8px;border-radius:8px;border:1px solid rgba(140,190,255,.35);background:rgba(0,8,35,.85);cursor:pointer;position:relative;box-shadow:inset 0 1px 3px rgba(0,0,0,.6);touch-action:none}
.track::before{content:"";position:absolute;left:-6px;right:-6px;top:-14px;bottom:-14px}
.fill{position:relative;height:100%;border-radius:8px;width:0;background:linear-gradient(90deg,#bfe6ff,var(--glow));box-shadow:0 0 10px var(--glow),0 0 2px #fff}
.fill::after{content:"";position:absolute;right:-6px;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;transform:translateY(-50%);box-shadow:0 0 8px var(--glow)}
#now{flex:none;font-size:18px;color:#dcecff;letter-spacing:0;white-space:nowrap}
#viz{flex:none;width:156px;height:44px;display:block;margin:0 4px;transform-origin:50% 100%}
#fxc{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:8px;padding:0 4px}
.vol{margin-left:auto;display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
.tab{background:none;border:0;padding:0;color:var(--dim);font-size:26px}
.tab.on{color:var(--glow);text-shadow:0 0 10px var(--glow)}
.tab:hover{box-shadow:none;color:#fff}
.drop{margin-left:auto}
body.over::before{content:"SUELTA TUS BEATS AQUÍ";position:fixed;inset:12px;border:4px dashed var(--glow);display:flex;align-items:center;justify-content:center;font-size:48px;color:#fff;background:rgba(5,20,90,.6);z-index:9}
input[type=file]{display:none}
input[type=range]{accent-color:var(--glow);width:110px}
.ct{border:2px solid var(--glow);background:var(--panel);padding:6px 12px;box-shadow:0 0 14px rgba(57,176,255,.3);line-height:1.1;font-size:18px}.ct b{color:#fff;font-weight:400;font-size:22px;display:inline;margin-right:8px}.ct .btn{text-decoration:none;margin:4px 6px 0 0;font-size:18px;padding:0 10px}
.bar,.info,#stage{min-width:0}
.cv small{background:rgba(0,0,25,.7);padding:0 4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.7em;color:#9fc3ff;margin-top:2px}
.cv small:empty,.cv.cur small,.cv.cur span{display:none}
@media(max-width:760px){
#stage{-webkit-mask-image:none;mask-image:none}
.app{grid-template-columns:44px minmax(0,1fr) 112px;gap:4px;padding:8px 6px}
.ic{font-size:26px;padding:4px 0}.ic small{display:none}.ic.on{transform:scale(1.35);margin:12px 0}
#stage{height:420px;min-height:380px}
.info{text-align:left;padding-left:4px}
#catn{font-size:15px}.info h1{font-size:26px;line-height:.95}#meta{font-size:18px;line-height:1}
#act{font-size:18px;padding:1px 6px;margin-top:8px}
.vol{display:none}.row{gap:6px}
.player{padding:8px 10px;gap:8px;border-radius:30px}.logo{font-size:20px}
.pb{width:32px;height:32px;font-size:16px}#now{font-size:14px}#viz{width:66px;height:30px}.logo{display:none}
.tab{font-size:22px}.tabs{gap:12px}.drop{margin-left:0}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fxc"></canvas>
<div class="app">
  <div class="icons" id="icons"></div>
  <div id="stage"></div>
  <div class="info">
    <div id="catn"></div>
    <h1 id="title"></h1>
    <p id="meta"></p>
        <button id="act" hidden>ENTER ▶</button>
  </div>
  <div class="bar">
    <div class="player">
      <div class="logo">🎵</div>
      <div class="pl-ctrl">
        <button class="pb" id="prev">⏮</button><button class="pb" id="pp">▶</button><button class="pb" id="next">⏭</button>
      </div>
      <div class="pl-prog">
        <div class="track" id="track"><div class="fill" id="fill"></div></div>
      </div>
      <span id="now">00:00 / 00:00</span>
      <canvas id="viz"></canvas>
    </div>
    <div class="row">
      <button id="bShuf" title="Aleatorio">🔀</button><button id="bRep" title="Repetir">🔁</button>
      <div class="tabs">
        <button class="tab on" data-t="0">BEATLAB</button>|<button class="tab" data-t="1">MY BEATS</button>
      </div>
      <span class="vol">VOL <input type="range" id="vol" min="0" max="1" step=".01" value=".8"></span>
    </div>
  </div>
  <div class="bar ct"><b>¿TE GUSTÓ ALGÚN BEAT?</b>Escríbeme diciendo cuál te interesa y lo coordinamos. <a class="btn" id="mail" href="#">✉ CORREO</a><a class="btn" id="ig" href="#" target="_blank" rel="noopener">📩 DM INSTAGRAM</a></div>
</div>
<audio id="au" controlsList="nodownload"></audio>
<script>
/* ====== TUS DATOS ====== */
const CFG={url:'https://cagmwdzgctkipicscwfk.supabase.co',key:'sb_publishable_B6HvFJlm77RR9JIk7y48Gw_fs2XFKH-',mail:'rodrigoalvitesflores@gmail.com',ig:'https://instagram.com/itsbastardo',name:'ITSBASTARDO',
  foto:'foto.jpg',   /* sube foto.jpg junto a index.html */
  tag:'tag.mp3',    /* sube tag.mp3 junto a index.html */
  artist:'https://open.spotify.com/intl-es/artist/4AgHFn8fbWSizGuPTwMWct',        /* link de tu perfil de Spotify: 'https://open.spotify.com/artist/XXXX' */
  spotify:[{t:'',u:'https://open.spotify.com/intl-es/track/1IBpgFdJBnkRCkhpliDxOM'}]        /* tus temas: [{t:'NOMBRE',u:'https://open.spotify.com/track/XXXX'},{t:'OTRO',u:'https://...'}] */
};
let BASS=0,fx=true,artImg='';
const LOW=innerWidth<760||(navigator.hardwareConcurrency||8)<=4;
/* ======================= */
const $=id=>document.getElementById(id),au=$('au'),stage=$('stage');
let T=[],cur=null,cat=2,tab=0,sel=[0,0,0,0,0],shuf=false,rep=false,rate=1,partOn=true,name='PRODUCER',taps=[],tapBpm=0,items=[],els=[];
name=CFG.name;document.oncontextmenu=e=>e.preventDefault();
au.volume=.8;
const fmt=s=>isFinite(s)?String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0'):'00:00';
const grad=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return `linear-gradient(135deg,hsl(${h},80%,45%),hsl(${(h+80)%360},85%,30%) 50%,hsl(${(h+160)%360},90%,55%))`};
const meta=t=>`${t.bpm||'--'} BPM / ${t.key||'--'} / ${t.genre||'--'}`;
const vis=()=>T.filter(t=>tab==1?t.fav:true);
const pub=p=>`${CFG.url}/storage/v1/object/public/beats/${encodeURI(p)}`;

/* ---------- Drum pads (sintetizados) ---------- */
let AC,NB;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}if(AC.state=='suspended')AC.resume();return AC}
function osc(type,f1,f2,dur,v){const a=ac(),o=a.createOscillator(),g=a.createGain(),n=a.currentTime;o.type=type;o.frequency.setValueAtTime(f1,n);o.frequency.exponentialRampToValueAtTime(f2,n+dur);g.gain.setValueAtTime(v*Math.max(au.volume,.15)+.0001,n);g.gain.exponentialRampToValueAtTime(.0001,n+dur);o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+dur)}
function noise(fr,type,dur,v){const a=ac(),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),n=a.currentTime;s.buffer=NB;f.type=type;f.frequency.value=fr;g.gain.setValueAtTime(v*Math.max(au.volume,.15),n);g.gain.exponentialRampToValueAtTime(.0001,n+dur);s.connect(f);f.connect(g);g.connect(a.destination);s.start(n);s.stop(n+dur)}
const PADS=[['KICK',()=>osc('sine',160,40,.35,1)],['SNARE',()=>{noise(1800,'highpass',.18,.6);osc('triangle',220,120,.12,.5)}],['HI-HAT',()=>noise(7000,'highpass',.05,.4)],['OPEN HAT',()=>noise(6000,'highpass',.3,.35)],['CLAP',()=>[0,20,40].forEach(d=>setTimeout(()=>noise(1200,'bandpass',.08,.6),d))],['TOM',()=>osc('sine',220,90,.3,.9)],['808',()=>osc('sine',70,38,.9,1)],['COWBELL',()=>{osc('square',560,540,.2,.2);osc('square',845,800,.2,.2)}],['MI TAG',()=>{const a=new Audio(CFG.tag);a.volume=Math.max(au.volume,.5);a.play().catch(()=>{})}]];

/* ---------- Categorías (iconos de la izquierda) ---------- */
function tap(){const n=performance.now();if(taps.length&&n-taps[taps.length-1]>2000)taps=[];taps.push(n);if(taps.length>1){const iv=(taps[taps.length-1]-taps[0])/(taps.length-1);tapBpm=Math.round(60000/iv);}build()}
const RATES=[.75,1,1.25,1.5];
const cats=[
 {n:'PERFIL',i:'👤',get:()=>[
  {t:name,s:'PRODUCTOR',e:'👤',bg:`url("${CFG.foto}"),linear-gradient(135deg,#1e44c8,#0a1a6a)`},
  {t:T.length+' BEATS',s:'DISPONIBLES PARA ESCUCHAR',e:'💿'},
  {t:'CORREO',s:'PARA COMPRAR O COTIZAR UN BEAT',e:'✉️',a:()=>location.href=$('mail').href},
  {t:'DM INSTAGRAM',s:'ESCRÍBEME POR MENSAJE',e:'📩',a:()=>window.open(CFG.ig,'_blank')},
  ...(CFG.artist?[{t:'SPOTIFY',s:'MI PERFIL DE ARTISTA',e:'🎧',bg:artImg?`url("${artImg}")`:'',a:()=>window.open(CFG.artist,'_blank')}]:[]),
  ...CFG.spotify.map(x=>({t:(x.t||'SPOTIFY').toUpperCase(),s:'ESCÚCHALO EN SPOTIFY',e:'🎧',bg:x.img?`url("${x.img}")`:'',a:()=>window.open(x.u,'_blank')}))]},
 {n:'HERRAMIENTAS',i:'💼',get:()=>[
  {t:'SHUFFLE '+(shuf?'ON':'OFF'),s:'REPRODUCCIÓN ALEATORIA',e:'🔀',a:()=>{shuf=!shuf;build()}},
  {t:'REPETIR '+(rep?'ON':'OFF'),s:'REPETIR EL BEAT ACTUAL',e:'🔁',a:()=>{rep=!rep;build()}},
  {t:'TAP TEMPO'+(tapBpm?' '+tapBpm:''),s:'TOCA AL RITMO (ENTER / CLIC)',e:'👆',a:tap}]},
 {n:'MÚSICA',i:'🎵',music:1,get:()=>{const l=vis();return l.length?l.map(t=>({t:t.title,s:meta(t),bg:t.cover?`url(${t.cover})`:grad(t.title),tr:t,a:()=>playT(t)})):[{t:'PRONTO NUEVOS BEATS',s:'VUELVE PRONTO',e:'🎵'}]}},
 {n:'DRUM PADS',i:'🎮',auto:1,get:()=>PADS.map((p,k)=>({t:p[0],s:'TECLA '+(k+1),e:k==8?'🏷️':'🥁',a:p[1]}))},
 {n:'AJUSTES',i:'⚙️',get:()=>[
  {t:'VELOCIDAD '+rate+'X',s:'CAMBIA EL TEMPO DEL BEAT',e:'⏱',a:()=>{rate=RATES[(RATES.indexOf(rate)+1)%4];au.playbackRate=rate;build()}},
  {t:'EFECTOS '+(fx?'ON':'OFF'),s:'FONDO Y ESPECTRO ANIMADOS',e:'⚡',a:()=>{fx=!fx;build()}},
  {t:'PARTÍCULAS '+(partOn?'ON':'OFF'),s:'FONDO ANIMADO',e:'✨',a:()=>{partOn=!partOn;build()}}]}
];
cats.forEach((c,k)=>{const b=document.createElement('button');b.className='ic';b.innerHTML=c.i+`<small>${c.n}</small>`;b.onclick=()=>setCat(k);$('icons').append(b)});
function setCat(k){cat=(k+cats.length)%cats.length;[...$('icons').children].forEach((b,j)=>b.classList.toggle('on',j==cat));build(1)}

/* ---------- Lista vertical con animación XMB ---------- */
function build(anim){
  items=cats[cat].get();sel[cat]=Math.max(0,Math.min(sel[cat],items.length-1));
  stage.innerHTML='';
  els=items.map((it,j)=>{const d=document.createElement('div');d.className='cv'+(anim?' in':'');
    d.style.backgroundImage=it.bg||'linear-gradient(135deg,#1e44c8,#0a1a6a)';
    d.innerHTML=(it.bg?'':`<em>${it.e||''}</em>`)+`<span></span><small></small>`;d.querySelector('span').textContent=it.t;if(it.tr)d.querySelector('small').textContent=it.s;
    d.onclick=()=>{if(sel[cat]==j){if(it.a)it.a()}else{go(j);if(cats[cat].music&&it.a)it.a()}};
    stage.append(d);return d});
  layout();info();
}
function layout(){
  const SH=stage.clientHeight,c=Math.min(270,SH*.46,stage.clientWidth*.85),s=c*.6,s0=sel[cat];
  els.forEach((d,j)=>{const k=j-s0,a=Math.abs(k),z=k==0?c:s,y=k==0?0:Math.sign(k)*(c/2+14+s/2+(a-1)*(s+12));
    d.style.width=d.style.height=z+'px';d.style.fontSize=(k==0?26:19)+'px';
    d.style.transform=`translate(-50%,calc(-50% + ${y}px))`;
    d.style.opacity=a==0?1:a==1?.6:a==2?.3:0;d.style.pointerEvents=a>2?'none':'auto';
    d.classList.toggle('cur',k==0);d.classList.toggle('pl',!!(items[j].tr&&items[j].tr===cur&&!au.paused))});
  $('pp').textContent=au.paused?'▶':'⏸';
}
function info(){
  const it=items[sel[cat]];
  $('catn').textContent=cats[cat].n;$('title').textContent=it?it.t:'';$('meta').textContent=it?it.s:'';
  $('act').hidden=!(it&&it.a)||!!it.tr;
}
function go(j){
  if(!items.length)return;j=Math.max(0,Math.min(j,items.length-1));if(j==sel[cat])return;
  sel[cat]=j;layout();info();if(cats[cat].auto&&items[j].a)items[j].a();
}

/* ---------- Reproducción ---------- */
function playT(t){cur=t;au.src=t.url;au.playbackRate=rate;au.play().catch(()=>{});layout()}
function step(d){
  const l=vis();if(!l.length)return;const i=l.indexOf(cur);
  const n=shuf?Math.floor(Math.random()*l.length):i<0?0:(i+d+l.length)%l.length;
  playT(l[n]);if(cats[cat].music)go(n);
}
$('pp').onclick=()=>{if(!cur){const l=vis();if(l.length){playT(l[0]);if(cats[cat].music)go(0)}return}au.paused?au.play():au.pause()};
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
$('bShuf').onclick=()=>{shuf=!shuf;$('bShuf').classList.toggle('on',shuf);build()};
$('bRep').onclick=()=>{rep=!rep;$('bRep').classList.toggle('on',rep);build()};
au.onplay=au.onpause=layout;
au.onended=()=>{if(rep){au.currentTime=0;au.play()}else{const l=vis();if(shuf||l.indexOf(cur)<l.length-1)step(1);else layout()}};
/* barra de tiempo: clic o arrastrar para mover la canción */
const trk=$('track');let seeking=false;
function upd(){if(seeking)return;$('fill').style.width=(au.duration&&isFinite(au.duration)?au.currentTime/au.duration*100:0)+'%';$('now').textContent=`${fmt(au.currentTime)} / ${fmt(au.duration)}`}
au.ontimeupdate=upd;au.addEventListener('loadedmetadata',upd);au.addEventListener('durationchange',upd);
function seekAt(e){if(!au.duration||!isFinite(au.duration))return null;const r=trk.getBoundingClientRect(),p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));$('fill').style.width=p*100+'%';$('now').textContent=`${fmt(p*au.duration)} / ${fmt(au.duration)}`;return p}
trk.addEventListener('pointerdown',e=>{if(!au.duration||!isFinite(au.duration))return;seeking=true;try{trk.setPointerCapture(e.pointerId)}catch(_){}seekAt(e);e.preventDefault()});
trk.addEventListener('pointermove',e=>{if(seeking)seekAt(e)});
trk.addEventListener('pointerup',e=>{if(!seeking)return;const p=seekAt(e);seeking=false;if(p!==null)au.currentTime=p*au.duration;upd()});
trk.addEventListener('pointercancel',()=>{seeking=false;upd()});
$('vol').oninput=e=>au.volume=+e.target.value;

$('act').onclick=()=>{const it=items[sel[cat]];if(it&&it.a)it.a()};

/* ---------- Pestañas ---------- */
function syncTabs(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',+b.dataset.t==tab))}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=+b.dataset.t;sel[2]=0;syncTabs();cat=2;setCat(2)});

/* ---------- Subir / bajar: teclado, rueda y dedo ---------- */
addEventListener('keydown',e=>{
  if(e.target.tagName=='INPUT')return;
  if(e.key=='ArrowDown'){e.preventDefault();go(sel[cat]+1)}
  else if(e.key=='ArrowUp'){e.preventDefault();go(sel[cat]-1)}
  else if(e.key=='ArrowRight')setCat(cat+1);
  else if(e.key=='ArrowLeft')setCat(cat-1);
  else if(e.key=='Enter'){const it=items[sel[cat]];if(it&&it.a)it.a()}
  else if(e.key==' '){e.preventDefault();$('pp').click()}
  else if(/^[1-9]$/.test(e.key)){PADS[+e.key-1][1]()}
});
let wt=0;
stage.addEventListener('wheel',e=>{e.preventDefault();const n=Date.now();if(n-wt<140)return;wt=n;go(sel[cat]+(e.deltaY>0?1:-1))},{passive:false});
let ty=null;
stage.addEventListener('touchstart',e=>ty=e.touches[0].clientY,{passive:true});
stage.addEventListener('touchmove',e=>{if(ty===null)return;const dy=ty-e.touches[0].clientY;if(Math.abs(dy)>45){go(sel[cat]+(dy>0?1:-1));ty=e.touches[0].clientY}},{passive:true});
stage.addEventListener('touchend',()=>ty=null);
addEventListener('resize',layout);

/* ---------- Ecualizador azul de segmentos (agresivo) + chispas ---------- */
let AN,SRC,FD,noCors=false,vl=0,idle=false,zc=0,mxs=90,pb=0,lastBeat=0;
const vz=$('viz'),vx=vz.getContext('2d'),dp=Math.min(window.devicePixelRatio||1,LOW?1:2);
const COLS=innerWidth<760?8:14,ROWS=innerWidth<760?7:10,lv=new Array(COLS).fill(0),pk=new Array(COLS).fill(0);
function vsz(){vz.width=Math.round(vz.clientWidth*dp);vz.height=Math.round(vz.clientHeight*dp);idle=false}addEventListener('resize',vsz);vsz();
au.crossOrigin='anonymous';
au.addEventListener('playing',()=>{if(SRC||noCors)return;try{const a=ac();AN=a.createAnalyser();AN.fftSize=256;AN.smoothingTimeConstant=.5;FD=new Uint8Array(AN.frequencyBinCount);SRC=a.createMediaElementSource(au);SRC.connect(AN);AN.connect(a.destination)}catch(e){AN=null}});
au.addEventListener('error',()=>{if(!SRC&&au.crossOrigin){noCors=true;au.crossOrigin=null;const s=au.src;au.src=s;au.play().catch(()=>{})}});

/* chispas: pocas, rápidas, salen del ecualizador */
const fc=$('fxc'),fxx=fc.getContext('2d'),MAXSP=LOW?28:52,PC=['#ffffff','#9be9ff','#33d6ff','#4f8cff'];let SP=[],fl=0,fdirty=false;
function fsz(){fc.width=innerWidth;fc.height=innerHeight}addEventListener('resize',fsz);fsz();
function emit(n,xf){if(!fx||!partOn)return;const r=vz.getBoundingClientRect();
  for(let i=0;i<n&&SP.length<MAXSP;i++)SP.push({x:r.left+(xf==null?Math.random():xf)*r.width,y:r.top+6,vx:(Math.random()-.5)*3.2,vy:-(3+Math.random()*7),l:1,d:.011+Math.random()*.017,s:2+Math.floor(Math.random()*3),ph:Math.random()*6,c:PC[Math.floor(Math.random()*PC.length)]})}
(function sf(ms){requestAnimationFrame(sf);if(ms-fl<(LOW?45:30))return;fl=ms;
  if(!SP.length){if(fdirty){fxx.clearRect(0,0,fc.width,fc.height);fdirty=false}return}
  fdirty=true;fxx.clearRect(0,0,fc.width,fc.height);fxx.globalCompositeOperation='lighter';
  SP=SP.filter(p=>p.l>0&&p.y>-20);
  for(const p of SP){p.x+=p.vx+Math.sin(p.y*.05+p.ph)*.7;p.y+=p.vy;p.vy+=.13;p.l-=p.d;
    const a=Math.max(0,p.l),tail=Math.abs(p.vy)*1.6;
    fxx.globalAlpha=a*.35;fxx.fillStyle=p.c;fxx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s+tail);
    fxx.globalAlpha=a;fxx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s)}
  fxx.globalAlpha=1;fxx.globalCompositeOperation='source-over';
})(0);

(function vf(ms){requestAnimationFrame(vf);if(ms-vl<(LOW?45:30))return;vl=ms;
  const on=!au.paused&&fx,t=ms/1000,tg=new Array(COLS).fill(0);let bass=0;
  if(on){
    if(AN){AN.getByteFrequencyData(FD);let tot=0,mx=0;for(let i=0;i<FD.length;i++){tot+=FD[i];if(FD[i]>mx)mx=FD[i]}zc=tot?0:zc+1;mxs=Math.max(mxs*.995,mx,80)}
    if(AN&&zc<12){
      for(let c=0;c<COLS;c++){const a=Math.floor(Math.pow(c/COLS,1.6)*FD.length*.7)+1,b=Math.max(a+1,Math.floor(Math.pow((c+1)/COLS,1.6)*FD.length*.7)+1);let s=0;for(let i=a;i<b;i++)s+=FD[i];tg[c]=Math.min(1,Math.pow(s/(b-a)/mxs,.85)*1.15)}
      bass=Math.min(1,(FD[1]+FD[2]+FD[3]+FD[4]+FD[5])/5/mxs)}
    else{for(let c=0;c<COLS;c++)tg[c]=Math.min(1,Math.max(0,(Math.sin(t*5+c*.9)+Math.sin(t*8.3-c*.5)+Math.sin(t*2.1+c))*.3+.5)*(1-c/COLS*.4));bass=tg[0]}
  }
  const beat=on&&bass-pb>.07&&bass>.3&&ms-lastBeat>140;pb=bass;
  if(beat){lastBeat=ms;emit(3+Math.round(bass*5))}
  BASS+=(bass-BASS)*.4;
  const pl=stage.querySelector('.cv.pl'),bq=(Math.round(BASS*8)/8).toFixed(2);if(pl&&pl.dataset.b!=bq){pl.dataset.b=bq;pl.style.setProperty('--b',bq)}
  let act=on||BASS>.01;
  for(let c=0;c<COLS;c++){
    if(beat&&c<4)tg[c]=Math.min(1,Math.max(tg[c],.55+bass*.45));
    lv[c]+=(tg[c]-lv[c])*(tg[c]>lv[c]?1:.3);pk[c]=Math.max(pk[c]-.04,lv[c]);
    if(on&&lv[c]>.72&&Math.random()<.22)emit(1,(c+.5)/COLS);
    if(lv[c]>.004||pk[c]>.004)act=true}
  vz.style.transform=`scale(${1+BASS*.12})`;vz.style.filter=`drop-shadow(0 0 ${2+BASS*10}px rgba(0,225,255,${.35+BASS*.65}))`;
  if(!act){if(idle)return;idle=true}else idle=false;
  const W=vz.width,H=vz.height,gap=Math.max(1,Math.round(1.4*dp)),cw=(W-gap*(COLS-1))/COLS,ch=(H-gap*(ROWS-1))/ROWS;
  vx.clearRect(0,0,W,H);
  for(let c=0;c<COLS;c++){
    const n=Math.round(lv[c]*ROWS),pr=Math.min(ROWS-1,Math.round(pk[c]*ROWS)-1),X=Math.round(c*(cw+gap));
    for(let r=0;r<ROWS;r++){
      const Y=Math.round(H-(r+1)*ch-r*gap),f=r/(ROWS-1);
      if(r<n){vx.shadowColor=f>.7?'rgba(255,255,255,.95)':'rgba(0,225,255,.95)';vx.shadowBlur=(4+f*5)*dp;vx.fillStyle=`hsl(${188-f*8},100%,${50+f*34}%)`}
      else if(r==pr&&pr>=n&&pk[c]>.02){vx.shadowColor='rgba(255,255,255,.95)';vx.shadowBlur=6*dp;vx.fillStyle='#ffffff'}
      else{vx.shadowBlur=0;vx.fillStyle=`hsl(${230-f*4},95%,${40-f*16}%)`}
      vx.fillRect(X,Y,Math.round(cw),Math.round(ch));
    }
  }
  vx.shadowBlur=0;
})(0);

/* ---------- Fondo PS3: onda + partículas ---------- */
(()=>{const cv=$('bg'),x=cv.getContext('2d');let W,H,P=[],lf=0;const FR=LOW?42:33,K=LOW?.5:1;
function rs(){W=cv.width=innerWidth*K|0;H=cv.height=innerHeight*K|0;P=Array.from({length:innerWidth<760?40:70},()=>({x:Math.random()*W,y:H*(.35+Math.random()*.5),r:Math.random()*1.4+.3,s:Math.random()*.25+.05,a:Math.random()*6.28,v:Math.random()*.02+.005}))}
addEventListener('resize',rs);rs();
const cy=(u,t)=>H*(.68-.3*u)+Math.sin(u*5+t*.6)*H*.05+Math.sin(u*9-t*.9)*H*.015,wd=(u,t)=>H*(.045+.035*Math.sin(u*4+t*.5)+.03*u);
function frame(ms){requestAnimationFrame(frame);if(ms-lf<FR||(!fx&&lf))return;lf=ms;const t=ms/1000,g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0e1650');g.addColorStop(.55,'#12278a');g.addColorStop(1,'#3558e0');
x.globalCompositeOperation='source-over';x.fillStyle=g;x.fillRect(0,0,W,H);x.globalCompositeOperation='lighter';const N=LOW?40:90,NL=LOW?10:24;
for(let k=0;k<=NL;k++){const f=k/NL*2-1;x.beginPath();
for(let i=0;i<=N;i++){const u=i/N,Y=cy(u,t)+f*wd(u,t)+Math.sin(u*14+t+k)*3;i?x.lineTo(u*W,Y):x.moveTo(0,Y)}
x.strokeStyle=`rgba(${110+Math.abs(f)*40},${140+Math.abs(f)*40},255,${.13-Math.abs(f)*.09})`;x.lineWidth=(2.2+BASS*1.5)*(K<1?.6:1);x.stroke()}
x.beginPath();for(let i=0;i<=N;i++){const u=i/N,Y=cy(u,t)-wd(u,t)*.9;i?x.lineTo(u*W,Y):x.moveTo(0,Y)}
for(let i=N;i>=0;i--){const u=i/N;x.lineTo(u*W,cy(u,t)+wd(u,t)*.9)}x.closePath();x.fillStyle='rgba(80,120,255,.13)';x.fill();
if(partOn)for(const p of P){p.x+=p.s*(1+BASS*2);p.a+=p.v*(1+BASS*1.5);if(p.x>W)p.x=0;const Y=p.y+Math.sin(p.a)*8+(cy(p.x/W,t)-H*.5)*.25;
x.fillStyle=`rgba(190,215,255,${.35+.45*Math.sin(p.a*2)})`;x.beginPath();x.arc(p.x,Y,p.r*(1+BASS*1.2)*(K<1?.9:1),0,6.28);x.fill()}
}
requestAnimationFrame(frame)})();

/* ---------- Inicio: cargar beats guardados ---------- */
setCat(2);
fetch(`${CFG.url}/rest/v1/beats?arch=eq.false&order=created_at.desc`,{headers:{apikey:CFG.key}}).then(r=>r.json()).then(a=>{(Array.isArray(a)?a:[]).forEach(r=>{r.url=pub(r.audio_path);r.cover=r.cover_path?pub(r.cover_path):'';T.push(r)});build()}).catch(()=>build());
$('mail').href='mailto:'+CFG.mail+'?subject='+encodeURIComponent('Quiero un beat');$('ig').href=CFG.ig;

/* ---------- Portadas de Spotify (automáticas) ---------- */
function loadSp(){
  const oe=(u,f)=>fetch('https://open.spotify.com/oembed?url='+encodeURIComponent(u)).then(r=>r.json()).then(f).catch(()=>{});
  Promise.all([...CFG.spotify.filter(x=>!x.img||!x.t).map(x=>oe(x.u,j=>{x.img=x.img||j.thumbnail_url;x.t=x.t||j.title})),
    ...(CFG.artist&&!artImg?[oe(CFG.artist,j=>{artImg=j.thumbnail_url||''})]:[])]).then(()=>{if(cat==0)build()});
}
loadSp();
</script>
